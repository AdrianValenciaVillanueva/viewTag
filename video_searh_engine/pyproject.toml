[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video_search_engine"
version = "0.1.0"
description = "Video semantic search engine with SigLIP embeddings and Qdrant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "torch>=2.0",
    "decord>=0.6",
    "transformers>=4.30",
    "sentencepiece>=0.1.99",
    "protobuf>=4.25",
    "qdrant-client>=1.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "testcontainers[qdrant]>=4.6",
]
dev = [
    "mypy>=1.7",
    "ruff>=0.1",
    "pre-commit>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "unit: Unit tests (fast, mocked)",
    "integration: Integration tests (real dependencies)",
    "slow: Slow tests (model loading, real API calls)",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "T20"]
ignore = ["E501", "B008"]
fixable = ["I", "F", "E", "W", "UP", "B", "C4", "T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true