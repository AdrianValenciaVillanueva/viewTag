# GitHub Actions CI Pipeline
# Runs on every push and PR to main branch
# Jobs: lint -> type-check -> unit-tests -> integration-tests -> docker-build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on new pushes to same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.8.0"

jobs:
  # =============================================================================
  # LINT - Code style and formatting
  # =============================================================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check video_searh_engine/src video_searh_engine/tests

      - name: Run ruff format check
        run: ruff format --check video_searh_engine/src video_searh_engine/tests

  # =============================================================================
  # TYPE-CHECK - Static type analysis
  # =============================================================================
  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mypy
          cd video_searh_engine
          pip install -e .[dev]

      - name: Run mypy
        run: |
          cd video_searh_engine
          mypy src/

  # =============================================================================
  # UNIT TESTS - Fast, mocked tests
  # =============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          cd video_searh_engine
          pip install -e .[test]

      - name: Run unit tests
        run: |
          cd video_searh_engine
          python -m pytest tests/unit -v --tb=short

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: video_searh_engine/.pytest_cache/
          retention-days: 7

  # =============================================================================
  # INTEGRATION TESTS - Real dependencies (Qdrant in-memory, real model)
  # =============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          cd video_searh_engine
          pip install -e .[test]

      - name: Run integration tests
        run: |
          cd video_searh_engine
          python -m pytest tests/integration -v --tb=short -m "integration and not slow"
        env:
          # Skip slow model download in CI by using a tiny test model or mock
          # For now, run with real model (takes ~2 min)
          HF_HUB_OFFLINE: "0"

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: video_searh_engine/.pytest_cache/
          retention-days: 7

  # =============================================================================
  # DOCKER BUILD - Verify Dockerfile builds correctly
  # =============================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, type-check, unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (CPU)
        uses: docker/build-push-action@v5
        with:
          context: ./video_searh_engine
          file: ./video_searh_engine/Dockerfile
          push: false
          load: true
          tags: viewtag:test
          build-args: |
            ENABLE_GPU=0

      - name: Test Docker image runs
        run: |
          docker run --rm -d --name viewtag-test -p 8000:8000 viewtag:test
          sleep 30  # Wait for model loading
          curl -f http://localhost:8000/health
          docker stop viewtag-test

  # =============================================================================
  # DOCKER BUILD GPU - Verify GPU-enabled image builds (optional, manual trigger)
  # =============================================================================
  docker-build-gpu:
    name: Docker Build (GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (GPU)
        uses: docker/build-push-action@v5
        with:
          context: ./video_searh_engine
          file: ./video_searh_engine/Dockerfile
          push: false
          load: true
          tags: viewtag:gpu-test
          build-args: |
            ENABLE_GPU=1

      - name: Test GPU image runs
        run: |
          docker run --rm -d --name viewtag-gpu-test --gpus all -p 8001:8000 viewtag:gpu-test
          sleep 60  # GPU model loading takes longer
          curl -f http://localhost:8001/health
          docker stop viewtag-gpu-test

  # =============================================================================
  # RELEASE - Build and push Docker image on tag
  # =============================================================================
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, type-check, unit-tests, integration-tests, docker-build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image (CPU)
        uses: docker/build-push-action@v5
        with:
          context: ./video_searh_engine
          file: ./video_searh_engine/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/viewtag:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/viewtag:latest
          build-args: |
            ENABLE_GPU=0

      - name: Build and push Docker image (GPU)
        uses: docker/build-push-action@v5
        with:
          context: ./video_searh_engine
          file: ./video_searh_engine/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/viewtag:${{ steps.version.outputs.VERSION }}-gpu
            ghcr.io/${{ github.repository }}/viewtag:gpu-latest
          build-args: |
            ENABLE_GPU=1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true